# CodeQL query exclusions for the security-and-quality suite.
#
# The suite's quality half overlaps heavily with the .NET analyzers and StyleCop
# that Directory.Build.props already runs at AnalysisMode=All with
# TreatWarningsAsErrors. Where the two disagree it is never because CodeQL found
# something new -- it is because CodeQL cannot see a per-member
# [SuppressMessage(..., Justification = "...")] or an .editorconfig severity, so
# it re-reports a decision this repository already made and wrote down as a
# permanently open alert.
#
# Every exclusion below names that decision. The rules:
#
#   * Never exclude a query that carries a security severity. None of these do.
#   * Prefer fixing the code. Exclude a query only when the finding duplicates a
#     rule the build already governs at a finer granularity, or when applying it
#     would make the code worse.
#   * A one-off false positive is dismissed on the alert itself with a written
#     reason, not excluded here -- a rule-wide filter is for rule-wide decisions.
#
# See AGENTS.md, "Static analysis", for the procedure when a new alert appears.

query-filters:
  # == CA1031 (do not catch general exception types) ==
  # On as an error, so no `catch (Exception)` compiles without an explicit
  # opt-out. All 19 sites carry a per-member [SuppressMessage] naming where the
  # failure surfaces, and several are load-bearing rather than lazy: this is an
  # incident log running live in an ELW, where killing the process mid-Einsatz
  # is the worst available outcome. SerialAudioQueue in particular catches
  # broadly so one misbehaving cue cannot silence every later Rückzugsalarm.
  - exclude:
      id: cs/catch-of-all-exceptions

  # == CA2000 / CA2213 (dispose objects before losing scope) ==
  # Already `= none` under [tests/**/*.cs] in .editorconfig: "Perf/impl-noise
  # rules -- they add churn to test code without catching real bugs." All 30
  # findings land inside exactly that scope, and none holds an OS handle open
  # across a run.
  - exclude:
      id: cs/local-not-disposed
  - exclude:
      id: cs/dispose-not-called-on-throw

  # == SA1600-SA1649 / CS1591 (documentation) ==
  # The StyleCop documentation family is disabled in .editorconfig and CS1591
  # sits in NoWarn: documentation is optional here, not mandated. The four
  # members flagged already carry substantial <param>/<returns> prose and only
  # skip the <summary> wrapper.
  - exclude:
      id: cs/xmldoc/missing-summary

  # == CA5392 (use DefaultDllImportSearchPaths) ==
  # On, and satisfied. The one P/Invoke -- winmm.dll PlaySound, which plays the
  # Rückzugsalarm from an in-memory buffer on Windows -- already carries
  # [DefaultDllImportSearchPaths(DllImportSearchPath.System32)], the exact
  # mitigation these two queries exist to prompt for, and its call site is
  # guarded by OperatingSystem.IsWindows().
  - exclude:
      id: cs/unmanaged-code
  - exclude:
      id: cs/call-to-unmanaged-code

  # == LINQ style suggestions ==
  # No Roslyn equivalent, no correctness content, and one is actively unsafe to
  # apply: TasksViewModel's loop condition mutates the fire-once alarm-dedupe
  # set, so moving it into a lazily-evaluated .Where(...) would change when, or
  # whether, the Aufgabe-fällig alarm sounds. The rest are ObservableCollection
  # refill loops and single-pass trim/dedupe loops that a Select or Where would
  # only lengthen.
  - exclude:
      id: cs/linq/missed-where
  - exclude:
      id: cs/linq/missed-select

  # == Generated code ==
  # Fires solely inside xunit's generated obj/.../XunitAutoGeneratedEntryPoint.cs,
  # which nobody edits. paths-ignore cannot reach it: GitHub restricts paths and
  # paths-ignore to interpreted languages or build-mode: none, and this analysis
  # is C# under build-mode: manual. Rule id is the only available lever.
  - exclude:
      id: cs/missed-ternary-operator
