# Changelog assembly. Each change carries its entry as its own file under
# changelog.d/, so no two pull requests ever edit the same lines and they cannot
# conflict over the changelog; `towncrier build` folds them into CHANGELOG.md
# when a release is cut. See CONTRIBUTING.md.

[tool.towncrier]
name = "Lagebuch"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
# An inline issue reference in the entry text, e.g. "(#302)". The link to the
# pull request itself is not rendered from here: every fragment is an orphan
# (see below), so towncrier has no number to work with, and the number does not
# exist yet while the pull request that carries the fragment is open.
# scripts/changelog-prlinks.py recovers it from git and prepends the link just
# before `towncrier build` — see docs/releasing.md.
issue_format = "(#{issue})"

# Fragments are named +<slug>.<type>.md so two pull requests citing the same
# ticket cannot collide on a filename. The leading + makes them orphans.
orphan_prefix = "+"
# Entries are written as finished prose; never reflow them.
wrap = false

# Keep a Changelog section order. Declared as an array (not tables) because
# towncrier renders array entries in the order given and tables alphabetically.
[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
