name: Scorecard

# OpenSSF Scorecard measures the repository's supply-chain posture: pinned
# actions, branch protection, dependency updates, signed releases and so on.
# publish_results is what lets api.securityscorecards.dev serve the README
# badge; the SARIF upload puts the same findings in the Code Scanning tab.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload the SARIF results
      id-token: write # required by publish_results
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Scorecard reads branch-protection settings with the default
          # GITHUB_TOKEN, which on a public repository sees only part of them.
          # A classic PAT with public_repo scope in a SCORECARD_TOKEN secret
          # would make the Branch-Protection check accurate. Deliberately not
          # used: this is a single-maintainer project whose branch rules are
          # what they are, and the extra long-lived credential costs more than
          # the reporting accuracy is worth.
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
