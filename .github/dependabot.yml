version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # NuGet packages across the solution. All Avalonia packages are grouped so
  # they arrive as a single pull request (they must always move in lockstep).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
    # xunit.v3 4.0.0 removes the TestIntrospectionHelper.GetTestCaseDetails()
    # overload that Avalonia.Headless.XUnit 12.1.1 still calls, breaking all
    # acceptance tests (AvaloniaUI/Avalonia#22072). Drop this ignore once
    # Avalonia ships a compatible package.
    ignore:
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
