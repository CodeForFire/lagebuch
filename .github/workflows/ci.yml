name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# This workflow builds and tests untrusted pull_request code; the token only
# needs to read the repository to check it out, so keep it read-only
# regardless of the org/repo default permissions.
permissions:
  contents: read

jobs:
  build-test:
    # Pin the display name to just the OS. GitHub derives a matrix job's name
    # from *every* matrix key, so without this the extra `solution`/`android`
    # keys below would rename the checks to e.g.
    # "build-test (ubuntu-latest, LageBuch.sln, true)" and the contexts
    # required by branch protection -- "build-test (ubuntu-latest)" and
    # "build-test (windows-latest)" -- would never be reported.
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds the full solution, Android head included -- it is also
          # the runner release.yml publishes the APK from.
          - os: ubuntu-latest
            solution: LageBuch.sln
            android: true
          # Windows only needs the desktop projects. It never ships an Android
          # artifact, and paying for one there is expensive: `dotnet workload
          # install android` takes ~4min on windows-latest because it goes down
          # the MSI installer path *and* syncs the image's VS-registered
          # maui/ios/wasm-tools workloads (only ~25% of that time is Android).
          # Building the Android head then costs another ~90s on top.
          - os: windows-latest
            solution: LageBuch.Desktop.slnf
            android: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK
        if: matrix.android
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android workload
        if: matrix.android
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      # One command per step, deliberately. Both of these used to share a single
      # `run: |` block, which on the Windows leg runs under pwsh -- where a native
      # command's non-zero exit does not abort the script and only the LAST
      # command's code becomes the step's. The whitespace check failed on every
      # Windows run (CRLF checkout, see .gitattributes) and was silently swallowed
      # by the style check passing after it, so this gate reported success while
      # enforcing nothing. Split like this, each command's exit code gates the job
      # under pwsh and bash alike, with no `shell:` override to depend on.
      - name: Format check (whitespace)
        run: dotnet format whitespace LageBuch.Desktop.slnf --verify-no-changes

      - name: Format check (style)
        run: dotnet format style LageBuch.Desktop.slnf --verify-no-changes

      - name: Build
        run: dotnet build ${{ matrix.solution }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ matrix.solution }} --configuration Release --no-build --verbosity normal

      # Coverage is informational only (no threshold gate yet -- see #301), run
      # as a second, non-blocking pass on ubuntu-latest only (full solution,
      # Android head included, so it has the most complete numbers). It must
      # not gate the PR: instrumentation overhead measurably increases the
      # flake rate of a couple of async host/client collaboration tests, and
      # that shouldn't fail a build the uninstrumented Test step just passed.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: >
          dotnet test ${{ matrix.solution }} --configuration Release --no-build --verbosity quiet
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator \
            "-reports:./coverage/**/coverage.cobertura.xml" \
            "-targetdir:./coverage/report" \
            "-reporttypes:MarkdownSummaryGithub"
          cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  # A pull request that changes src/ carries its changelog entry as its own file
  # in changelog.d/, never as an edit to CHANGELOG.md — one file per change is
  # what keeps concurrent pull requests from conflicting over the changelog.
  # Apply the `no-changelog` label to skip this.
  changelog-check:
    name: changelog entry
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install towncrier
        run: pip install -r .github/requirements-changelog.txt

      - name: Require a changelog fragment for src/ changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -q '^src/'; then
            towncrier check --compare-with "origin/${BASE_REF}"
          else
            echo "No src/ changes in this pull request — changelog fragment not required."
          fi

      # Advisory, never a gate. CHANGELOG.md is English (CONTRIBUTING.md), but
      # every correct entry here carries German Fachbegriffe — Atemschutz,
      # Stammdaten, Messreihe — so a detector strict enough to block on would
      # fail hardest on the entries that are right. The script exits 0 rather
      # than the job using continue-on-error, so this job's conclusion keeps its
      # one meaning: a changelog fragment exists.
      - name: Hint if a changelog fragment looks German
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mapfile -t fragments < <(
            git diff --name-only --diff-filter=AM \
              "origin/${BASE_REF}...HEAD" -- changelog.d
          )
          if [ ${#fragments[@]} -eq 0 ]; then
            echo "No changelog fragments added or changed in this pull request."
          else
            python scripts/changelog-language-hint.py "${fragments[@]}"
          fi
