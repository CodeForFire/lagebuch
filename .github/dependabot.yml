version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # NuGet packages across the solution. All Avalonia packages are grouped so
  # they arrive as a single pull request (they must always move in lockstep).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
