name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# This workflow builds and tests untrusted pull_request code; the token only
# needs to read the repository to check it out, so keep it read-only
# regardless of the org/repo default permissions.
permissions:
  contents: read

jobs:
  build-test:
    # Pin the display name to just the OS. GitHub derives a matrix job's name
    # from *every* matrix key, so without this the extra `solution`/`android`
    # keys below would rename the checks to e.g.
    # "build-test (ubuntu-latest, LageBuch.sln, true)" and the contexts
    # required by branch protection -- "build-test (ubuntu-latest)" and
    # "build-test (windows-latest)" -- would never be reported.
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds the full solution, Android head included -- it is also
          # the runner release.yml publishes the APK from.
          - os: ubuntu-latest
            solution: LageBuch.sln
            android: true
          # Windows only needs the desktop projects. It never ships an Android
          # artifact, and paying for one there is expensive: `dotnet workload
          # install android` takes ~4min on windows-latest because it goes down
          # the MSI installer path *and* syncs the image's VS-registered
          # maui/ios/wasm-tools workloads (only ~25% of that time is Android).
          # Building the Android head then costs another ~90s on top.
          - os: windows-latest
            solution: LageBuch.Desktop.slnf
            android: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK
        if: matrix.android
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android workload
        if: matrix.android
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Format check
        run: |
          dotnet format whitespace LageBuch.Desktop.slnf --verify-no-changes
          dotnet format style LageBuch.Desktop.slnf --verify-no-changes

      - name: Build
        run: dotnet build ${{ matrix.solution }} --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test ${{ matrix.solution }} --configuration Release --no-build --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      # Coverage summary only needs to run once; ubuntu-latest builds the full
      # solution (Android head included), so it has the most complete numbers.
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator \
            "-reports:./coverage/**/coverage.cobertura.xml" \
            "-targetdir:./coverage/report" \
            "-reporttypes:MarkdownSummaryGithub"
          cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  changelog-check:
    name: changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry for src/ changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if grep -q '^src/' <<<"$changed" && ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "::error::This PR changes src/ but does not update CHANGELOG.md (add an entry under ## [Unreleased])."
            exit 1
          fi
